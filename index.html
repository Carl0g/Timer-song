<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --bw:3px;
    --o-08:0.08;
    --o-14:0.14;
    --o-25:0.25;
    --o-40:0.4;
    --o-55:0.55;
    --o-70:0.7;
    --o-90:0.9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--fg);
    font-family:'VT323', ui-monospace, monospace;
    overflow:hidden; overscroll-behavior:none;
  }
  .p8{ font-family:'Press Start 2P', 'VT323', monospace; }
  .plain{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

  #app{ position:relative; width:100vw; height:100vh; height:100dvh; }

  .screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 420ms ease;
    padding:18px;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- the "hardware display" panel shared by every screen ---------- */
  .device{
    width:min(380px, 92vw);
    border:var(--bw) solid var(--fg);
    padding:16px 16px 14px;
    position:relative;
    background:#000;
  }
  .device-row{ display:flex; justify-content:space-between; align-items:center; }
  .device-title{ font-size:13px; opacity:var(--o-70); letter-spacing:0.5px; }
  .icon-btn{
    background:none; border:none; color:var(--fg); opacity:var(--o-55);
    font-size:18px; padding:4px 6px; cursor:pointer; font-family:'VT323',monospace; line-height:1;
  }
  .icon-btn:active{ opacity:var(--o-90); }

  /* ---------- SETUP ---------- */
  .setup-body{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:22px; }
  .time-readout{
    font-size:64px; line-height:1; opacity:0; transform:translateY(4px);
    transition:opacity 220ms ease, transform 220ms ease;
  }
  .time-readout.show{ opacity:var(--o-90); transform:translateY(0); }
  .time-readout .unit{ font-size:0.4em; opacity:0.6; margin-left:6px; }

  .segbar{ width:100%; display:flex; gap:2px; touch-action:none; cursor:grab; padding:14px 0; }
  .segbar .seg{ flex:1; height:20px; background:rgba(255,255,255,var(--o-08)); }
  .segbar .seg.lit{ background:var(--fg); }

  .hint{ font-size:14px; opacity:var(--o-40); transition:opacity 300ms ease; text-align:center; }
  .hint.hidden{ opacity:0; }

  #morph-bar{
    position:absolute; height:20px; background:var(--fg); opacity:0.5;
    pointer-events:none; z-index:20;
  }

  /* ---------- RUN ---------- */
  .run-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; width:min(380px,92vw); }
  .device-top-mini{ font-size:13px; opacity:var(--o-70); }
  .viz-canvas{ width:100%; height:132px; display:block; margin-top:10px; }
  .device-bottom{ font-size:20px; opacity:var(--o-80,.8); margin-top:6px; }
  .device-bottom .d-label{ opacity:0.55; margin-right:6px; }
  .bracket-bar{ display:flex; align-items:center; gap:5px; }
  .bracket-tick{ width:3px; height:13px; background:rgba(255,255,255,var(--o-55)); }
  .bracket-segments{ display:flex; gap:2px; }
  .seg-sm{ width:6px; height:10px; background:rgba(255,255,255,var(--o-14)); }
  .seg-sm.lit{ background:rgba(255,255,255,var(--o-90)); }

  .hud-box{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    border:var(--bw) solid var(--fg); background:#000;
    padding:10px 16px; text-align:center; opacity:0;
    transition:opacity 160ms ease; pointer-events:none;
  }
  .hud-box .hud-title{ font-size:12px; opacity:var(--o-70); margin-bottom:4px; }
  .hud-box .hud-value{ font-size:26px; }

  .eq-wrap{ display:flex; gap:8px; justify-content:center; width:min(380px,92vw); }
  .eq-channel{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .eq-track{
    width:100%; max-width:34px; height:96px; border:2px solid rgba(255,255,255,var(--o-25));
    touch-action:none; cursor:grab; display:flex; flex-direction:column-reverse; gap:2px; padding:3px;
  }
  .eq-seg{ width:100%; flex:1; background:rgba(255,255,255,var(--o-08)); }
  .eq-seg.lit{ background:var(--fg); }
  .eq-label{ font-size:11px; opacity:var(--o-55); letter-spacing:0.3px; }

  .speed-wrap{ width:min(380px,92vw); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .speed-label{ font-size:11px; opacity:var(--o-55); letter-spacing:0.5px; }
  .speed-bar .seg{ height:16px; }

  .run-actions{ display:flex; gap:22px; align-items:center; justify-content:center; width:min(380px,92vw); }
  .action-btn{
    flex:1; background:none; border:2px solid rgba(255,255,255,var(--o-40));
    color:var(--fg); opacity:var(--o-80,.8); font-size:16px; padding:12px 10px; cursor:pointer;
    font-family:'VT323',monospace; transition:opacity 150ms ease, border-color 150ms ease;
  }
  .action-btn:active{ opacity:1; border-color:rgba(255,255,255,0.9); }
  .action-btn.muted{ opacity:var(--o-40); }

  /* ---------- LOG ---------- */
  .log-body{ display:flex; flex-direction:column; align-items:stretch; gap:14px; margin-top:8px; }
  .log-header{ text-align:center; }
  .log-duration{ font-size:44px; opacity:var(--o-90); }
  .log-sub{ font-size:14px; opacity:var(--o-55); margin-top:2px; letter-spacing:0.5px; }

  .log-list{ display:flex; flex-direction:column; gap:8px; max-height:44vh; overflow-y:auto; padding:2px; }
  .log-row{
    display:flex; align-items:center; justify-content:space-between;
    border:2px solid rgba(255,255,255,var(--o-40));
    padding:14px 16px; font-size:19px; opacity:var(--o-90); cursor:pointer;
    transition:background 120ms ease, border-color 120ms ease;
  }
  .log-row:active{ background:rgba(255,255,255,0.08); border-color:var(--fg); }
  .log-row .arrow{ opacity:var(--o-55); }
  .log-back{ padding:10px 4px; font-size:14px; opacity:var(--o-55); cursor:pointer; }

  .skip-btn{
    background:none; border:none; color:var(--fg); opacity:var(--o-40);
    font-size:13px; padding:10px; cursor:pointer; align-self:center;
  }
  .skip-btn:active{ opacity:var(--o-90); }

  /* ---------- HISTORY ---------- */
  .history-body{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .history-header{ text-align:center; }
  .history-total{ font-size:40px; opacity:var(--o-90); }
  .history-count{ font-size:13px; opacity:var(--o-55); }
  .history-filters{ display:flex; gap:6px; }
  .filter-btn{
    flex:1; background:none; border:2px solid rgba(255,255,255,var(--o-25));
    color:var(--fg); opacity:var(--o-55); font-size:13px; padding:7px 4px; cursor:pointer;
    font-family:'VT323',monospace;
  }
  .filter-btn.active{ opacity:1; border-color:var(--fg); background:rgba(255,255,255,0.1); }
  .history-list{ display:flex; flex-direction:column; gap:6px; max-height:40vh; overflow-y:auto; }
  .history-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    border-bottom:1px solid rgba(255,255,255,var(--o-14));
    padding:8px 2px; font-size:15px; opacity:var(--o-80,.8);
  }
  .history-row .h-date{ opacity:0.7; width:56px; flex-shrink:0; }
  .history-row .h-cat{ flex:1; text-align:left; }
  .history-empty{ text-align:center; opacity:var(--o-25); font-size:14px; margin-top:20px; }
</style>
</head>
<body>
<div id="app">

  <section id="screen-setup" class="screen active">
    <div class="device">
      <div class="device-row">
        <span class="device-title p8">FOCO</span>
        <button id="btn-history" class="icon-btn" aria-label="Histórico">≡</button>
      </div>
      <div class="setup-body">
        <div class="time-readout" id="setup-time">00<span class="unit">min</span></div>
        <div class="segbar" id="bar-track"></div>
        <div class="hint" id="setup-hint">arraste para definir o tempo</div>
      </div>
    </div>
  </section>

  <section id="screen-run" class="screen">
    <div class="run-wrap">
      <div class="device" id="device-frame" style="position:relative;">
        <div class="device-row">
          <span class="device-top-mini" id="combo-label">chuva + vento</span>
          <span class="device-top-mini" id="carregando" style="opacity:.6">carregando…</span>
        </div>
        <canvas id="viz" class="viz-canvas"></canvas>
        <div class="device-row device-bottom">
          <span><span class="d-label">FOCO</span><span id="run-timer">50:00</span></span>
          <span class="bracket-bar">
            <span class="bracket-tick"></span>
            <span class="bracket-segments" id="progress-segments"></span>
            <span class="bracket-tick"></span>
          </span>
        </div>
        <div class="hud-box" id="hud-box">
          <div class="hud-title p8" id="hud-title">CHUVA</div>
          <div class="hud-value" id="hud-value">62%</div>
        </div>
      </div>

      <div class="eq-wrap">
        <div class="eq-channel"><div class="eq-track" id="eq-chuva" data-layer="chuva"></div><div class="eq-label p8">CHV</div></div>
        <div class="eq-channel"><div class="eq-track" id="eq-vento" data-layer="vento"></div><div class="eq-label p8">VNT</div></div>
        <div class="eq-channel"><div class="eq-track" id="eq-fauna" data-layer="fauna"></div><div class="eq-label p8">FAU</div></div>
        <div class="eq-channel"><div class="eq-track" id="eq-ruido" data-layer="ruido"></div><div class="eq-label p8">RUI</div></div>
        <div class="eq-channel"><div class="eq-track" id="eq-mar" data-layer="mar"></div><div class="eq-label p8">MAR</div></div>
        <div class="eq-channel"><div class="eq-track" id="eq-cachoeira" data-layer="cachoeira"></div><div class="eq-label p8">CAC</div></div>
      </div>

      <div class="speed-wrap">
        <div class="speed-label p8">VELOCIDADE</div>
        <div class="segbar speed-bar" id="speed-track"></div>
      </div>

      <div class="run-actions">
        <button id="btn-pause" class="action-btn" aria-label="Pausar">II PAUSAR</button>
        <button id="btn-end" class="action-btn" aria-label="Encerrar">■ FIM</button>
      </div>
    </div>
  </section>

  <section id="screen-log" class="screen">
    <div class="device">
      <div class="device-row"><span class="device-title p8">REGISTRO</span><span></span></div>
      <div class="log-body">
        <div class="log-header">
          <div class="log-duration" id="log-duration">0 min</div>
          <div class="log-sub plain">o que você fez?</div>
        </div>
        <div class="log-list" id="log-list"></div>
        <button class="skip-btn plain" id="btn-skip">pular registro</button>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="device">
      <div class="device-row">
        <span class="device-title p8">HISTÓRICO</span>
        <button id="btn-history-back" class="icon-btn" aria-label="Voltar">←</button>
      </div>
      <div class="history-body">
        <div class="history-header">
          <div class="history-total" id="history-total">0h 00</div>
          <div class="history-count plain" id="history-count">0 sessões</div>
        </div>
        <div class="history-filters">
          <button class="filter-btn active" data-filter="all">TUDO</button>
          <button class="filter-btn" data-filter="Trabalho">TRAB</button>
          <button class="filter-btn" data-filter="Faculdade">FAC</button>
        </div>
        <div class="history-list plain" id="history-list"></div>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ========================================================
     STATE / NAVIGATION
     ======================================================== */
  const screens = {
    setup: document.getElementById('screen-setup'),
    run: document.getElementById('screen-run'),
    log: document.getElementById('screen-log'),
    history: document.getElementById('screen-history'),
  };
  function goTo(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }
  function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  /* ========================================================
     STORAGE
     ======================================================== */
  const STORE_KEY = 'foco_sessions_v1';
  function loadSessions(){
    try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveSession(rec){
    try{ const list = loadSessions(); list.push(rec); localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
    catch(e){}
  }

  /* ========================================================
     SETUP — segmented drag bar
     ======================================================== */
  const barTrack = document.getElementById('bar-track');
  const setupTime = document.getElementById('setup-time');
  const setupHint = document.getElementById('setup-hint');
  const SETUP_SEGS = 30; // each segment = 2 minutes
  const segEls = [];
  for(let i=0;i<SETUP_SEGS;i++){
    const s = document.createElement('div');
    s.className = 'seg';
    barTrack.appendChild(s);
    segEls.push(s);
  }

  let selectedMinutes = 0;
  let dragging = false;

  function pctFromEvent(clientX){
    const rect = barTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    return Math.max(0, Math.min(1, pct));
  }
  function renderBar(pct, minutes){
    const lit = Math.round(pct*SETUP_SEGS);
    segEls.forEach((s,i)=> s.classList.toggle('lit', i<lit));
    setupTime.innerHTML = String(minutes).padStart(2,'0') + '<span class="unit">min</span>';
  }
  function onDragStart(e){
    dragging = true;
    barTrack.style.cursor = 'grabbing';
    setupHint.classList.add('hidden');
    setupTime.classList.add('show');
    onDragMove(e);
    vibrate(6);
  }
  function onDragMove(e){
    if(!dragging) return;
    const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
    const pct = pctFromEvent(clientX);
    selectedMinutes = Math.round(pct*60);
    renderBar(pct, selectedMinutes);
  }
  function onDragEnd(){
    if(!dragging) return;
    dragging = false;
    barTrack.style.cursor = 'grab';
    if(selectedMinutes <= 0){
      renderBar(0,0);
      setupTime.classList.remove('show');
      setupHint.classList.remove('hidden');
      return;
    }
    vibrate(10);
    confirmAndTransform();
  }
  barTrack.addEventListener('pointerdown', (e)=>{ barTrack.setPointerCapture(e.pointerId); onDragStart(e); });
  barTrack.addEventListener('pointermove', onDragMove);
  barTrack.addEventListener('pointerup', onDragEnd);
  barTrack.addEventListener('pointercancel', onDragEnd);

  function confirmAndTransform(){
    const rect = barTrack.getBoundingClientRect();
    const morph = document.createElement('div');
    morph.id = 'morph-bar';
    morph.style.left = rect.left+'px';
    morph.style.top = rect.top+'px';
    morph.style.width = rect.width+'px';
    document.getElementById('app').appendChild(morph);

    screens.setup.style.transition = 'opacity 220ms ease';
    screens.setup.style.opacity = '0';

    requestAnimationFrame(()=>{
      morph.style.transition = 'all 460ms cubic-bezier(.2,.7,.2,1)';
      morph.style.opacity = '0';
      morph.style.top = (window.innerHeight*0.34)+'px';
    });

    setTimeout(()=>{
      screens.setup.style.opacity='';
      screens.setup.style.transition='';
      morph.remove();
      startSession(selectedMinutes);
    }, 460);
  }

  /* ========================================================
     AUDIO ENGINE — 7 real ambient loops, panned mixer,
     master high-pass + compressor for a cleaner mix
     ======================================================== */
  const AudioEngine = (function(){
    let ctx = null, master = null, analyser = null, hp = null, comp = null;
    let layers = {};
    let levels = { chuva:0.5, vento:0.5, fauna:0.0, ruido:0.12, mar:0.0, cachoeira:0.0 };
    const BASE_VOL = { chuva:0.9, vento:0.9, fauna:1.0, ruido:0.7, mar:0.95, cachoeira:0.9 };
    let ready = false, starting = false;
    let currentSpeed = 1.0;

    function b64ToArrayBuffer(b64){
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }
    async function decodeAll(){
      const entries = Object.keys(AUDIO_B64);
      const buffers = {};
      await Promise.all(entries.map(async (k)=>{
        const arr = b64ToArrayBuffer(AUDIO_B64[k]);
        buffers[k] = await ctx.decodeAudioData(arr.slice(0));
      }));
      return buffers;
    }

    async function init(onReady){
      if(starting) return;
      starting = true;
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.95;

      hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 45;
      hp.Q.value = 0.7;

      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 18;
      comp.ratio.value = 3.2;
      comp.attack.value = 0.01;
      comp.release.value = 0.25;

      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.55;

      master.connect(hp);
      hp.connect(comp);
      comp.connect(analyser);
      analyser.connect(ctx.destination);

      const buffers = await decodeAll();
      Object.keys(buffers).forEach(k=>{
        const src = ctx.createBufferSource();
        src.buffer = buffers[k];
        src.loop = true;
        src.playbackRate.value = currentSpeed;

        const gain = ctx.createGain();
        gain.gain.value = levels[k]*BASE_VOL[k];

        const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        src.connect(gain);
        if(panner){
          gain.connect(panner);
          panner.connect(master);
          // slow independent pan drift for natural stereo movement
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 0.02 + Math.random()*0.03;
          const depth = ctx.createGain();
          depth.gain.value = 0.18 + Math.random()*0.1;
          lfo.connect(depth);
          depth.connect(panner.pan);
          lfo.start();
        } else {
          gain.connect(master);
        }
        src.start();
        layers[k] = { src, gain };
      });
      ready = true;
      starting = false;
      if(onReady) onReady();
    }

    function comboName(){
      const names = {chuva:'chuva', vento:'vento', fauna:'fauna', ruido:'ruído', mar:'mar', cachoeira:'cachoeira'};
      const on = Object.keys(levels).filter(k=>levels[k] > 0.04).map(k=>names[k]);
      return on.length ? on.join(' + ') : 'silêncio';
    }
    function setLevel(kind, level){
      levels[kind] = level;
      if(ready && layers[kind]){
        const now = ctx.currentTime;
        const g = layers[kind].gain.gain;
        g.cancelScheduledValues(now);
        g.setTargetAtTime(level*BASE_VOL[kind], now, 0.06);
      }
      return comboName();
    }
    function getLevel(kind){ return levels[kind]; }
    function setSpeed(v){
      currentSpeed = v;
      if(ready){
        const now = ctx.currentTime;
        Object.values(layers).forEach(l=>{
          l.src.playbackRate.cancelScheduledValues(now);
          l.src.playbackRate.setTargetAtTime(v, now, 0.08);
        });
      }
    }
    function getSpeed(){ return currentSpeed; }
    function suspend(){ if(ctx && ctx.state==='running') ctx.suspend(); }
    function resume(){ if(ctx && ctx.state==='suspended') ctx.resume(); }
    function fadeMaster(to, t){ if(master) master.gain.setTargetAtTime(to, ctx.currentTime, t||0.3); }
    function stopAll(){
      if(!ready) return;
      try{ Object.values(layers).forEach(l=>{ try{ l.src.stop(); }catch(e){} }); ctx.close(); }catch(e){}
      ready = false; layers = {};
    }
    function getFreqData(){
      if(!analyser) return new Uint8Array(0);
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      return data;
    }
    return { init, setLevel, getLevel, setSpeed, getSpeed, suspend, resume, fadeMaster, stopAll, getFreqData, comboName, isReady:()=>ready };
  })();

  /* ========================================================
     VISUALIZER — segmented LED-style bars + peak-hold caps
     ======================================================== */
  const canvas = document.getElementById('viz');
  const vctx = canvas.getContext('2d');
  let vizRAF = null;
  const BAR_COUNT = 17;
  const N_SEG = 8;
  const peakLevels = new Array(BAR_COUNT).fill(0);
  let driftT = 0;

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.floor(rect.width*dpr);
    canvas.height = Math.floor(rect.height*dpr);
    vctx.setTransform(dpr,0,0,dpr,0,0);
    vctx.imageSmoothingEnabled = false;
  }

  function drawViz(){
    vizRAF = requestAnimationFrame(drawViz);
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    vctx.clearRect(0,0,w,h);

    const data = AudioEngine.getFreqData();
    const usable = data.length ? data.slice(1, Math.floor(data.length*0.72)) : [];
    const step = Math.max(1, Math.floor(usable.length / BAR_COUNT));
    driftT += 0.15;
    const binOffset = usable.length ? Math.floor((Math.sin(driftT*0.01)+1)/2 * step) : 0;

    const gap = Math.max(3, w*0.014);
    const barW = (w - gap*(BAR_COUNT-1)) / BAR_COUNT;
    const segH = Math.max(3, (h-6)/N_SEG - 3);
    const segGap = 3;

    for(let i=0;i<BAR_COUNT;i++){
      let v = 0;
      if(usable.length){
        const idx = Math.min(usable.length-1, i*step+binOffset);
        v = usable[idx]/255;
      }
      const lit = Math.max(0, Math.min(N_SEG, Math.round(v*N_SEG)));
      if(v > peakLevels[i]) peakLevels[i] = v;
      else peakLevels[i] = Math.max(0, peakLevels[i]-0.012);
      const peakSeg = Math.min(N_SEG-1, Math.round(peakLevels[i]*N_SEG));

      const x = i*(barW+gap);
      for(let s=0;s<N_SEG;s++){
        const y = h - 3 - (s+1)*(segH+segGap) + segGap;
        const isLit = s < lit;
        const isPeak = s === peakSeg && peakSeg >= lit;
        let alpha = isLit ? 0.9 : 0.1;
        if(isPeak) alpha = 1;
        vctx.fillStyle = 'rgba(255,255,255,'+alpha.toFixed(3)+')';
        vctx.fillRect(Math.round(x), Math.round(y), Math.max(2,Math.round(barW)), Math.round(segH));
      }
    }
  }
  window.addEventListener('resize', resizeCanvas);

  /* ========================================================
     PROGRESS SEGMENTS (bracket bar)
     ======================================================== */
  const SEG_COUNT = 14;
  const progressSegWrap = document.getElementById('progress-segments');
  const progressSegEls = [];
  for(let i=0;i<SEG_COUNT;i++){
    const s = document.createElement('span');
    s.className = 'seg-sm';
    progressSegWrap.appendChild(s);
    progressSegEls.push(s);
  }
  function renderProgressSegments(pct){
    const lit = Math.round(pct*SEG_COUNT);
    progressSegEls.forEach((s,i)=> s.classList.toggle('lit', i<lit));
  }

  /* ========================================================
     EQ FADERS (7 channels) + HUD readout
     ======================================================== */
  const EQ_SEGS = 7;
  const LAYER_NAMES = { chuva:'CHUVA', vento:'VENTO', fauna:'FAUNA', ruido:'RUÍDO', mar:'MAR', cachoeira:'CACHOEIRA' };
  const eqTracks = {};
  ['chuva','vento','fauna','ruido','mar','cachoeira'].forEach(k=>{
    eqTracks[k] = document.getElementById('eq-'+k);
  });
  const eqSegEls = {};
  Object.keys(eqTracks).forEach(k=>{
    const track = eqTracks[k];
    eqSegEls[k] = [];
    for(let i=0;i<EQ_SEGS;i++){
      const s = document.createElement('div');
      s.className = 'eq-seg';
      track.appendChild(s);
      eqSegEls[k].push(s);
    }
  });
  const comboLabel = document.getElementById('combo-label');
  const hudBox = document.getElementById('hud-box');
  const hudTitle = document.getElementById('hud-title');
  const hudValue = document.getElementById('hud-value');
  let hudHideTimer = null;

  function renderEq(kind, level){
    const lit = Math.round(level*EQ_SEGS);
    eqSegEls[kind].forEach((s,i)=> s.classList.toggle('lit', i<lit));
  }
  function initEqDisplay(){
    Object.keys(eqTracks).forEach(k=> renderEq(k, AudioEngine.getLevel(k)));
    comboLabel.textContent = AudioEngine.comboName();
  }
  function levelFromPointer(track, clientY){
    const rect = track.getBoundingClientRect();
    let pct = 1 - ((clientY - rect.top) / rect.height);
    pct = Math.max(0, Math.min(1, pct));
    return Math.round(pct*EQ_SEGS)/EQ_SEGS;
  }
  function showHud(kind, level){
    hudTitle.textContent = LAYER_NAMES[kind];
    hudValue.textContent = Math.round(level*100)+'%';
    hudBox.style.opacity = '1';
    clearTimeout(hudHideTimer);
  }
  function hideHudSoon(){
    clearTimeout(hudHideTimer);
    hudHideTimer = setTimeout(()=>{ hudBox.style.opacity = '0'; }, 550);
  }

  Object.keys(eqTracks).forEach(kind=>{
    const track = eqTracks[kind];
    let active = false;
    function apply(e){
      const clientY = (e.touches ? e.touches[0].clientY : e.clientY);
      const level = levelFromPointer(track, clientY);
      const name = AudioEngine.setLevel(kind, level);
      renderEq(kind, level);
      comboLabel.textContent = name;
      showHud(kind, level);
    }
    track.addEventListener('pointerdown', (e)=>{
      track.setPointerCapture(e.pointerId);
      active = true; apply(e); vibrate(6);
    });
    track.addEventListener('pointermove', (e)=>{ if(active) apply(e); });
    track.addEventListener('pointerup', ()=>{ active=false; hideHudSoon(); });
    track.addEventListener('pointercancel', ()=>{ active=false; hideHudSoon(); });
  });

  /* ========================================================
     SPEED CONTROL — governs playback rate of every layer (0x–2x)
     ======================================================== */
  const SPEED_SEGS = 20; // each segment = 0.1x
  const speedTrack = document.getElementById('speed-track');
  const speedSegEls = [];
  for(let i=0;i<SPEED_SEGS;i++){
    const s = document.createElement('div');
    s.className = 'seg';
    speedTrack.appendChild(s);
    speedSegEls.push(s);
  }
  function renderSpeedBar(speed){
    const lit = Math.round((speed/2)*SPEED_SEGS);
    speedSegEls.forEach((s,i)=> s.classList.toggle('lit', i<lit));
  }
  function speedFromPointer(clientX){
    const rect = speedTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    const steps = Math.round(pct*SPEED_SEGS);
    return (steps/SPEED_SEGS)*2;
  }
  let speedActive = false;
  function applySpeed(e){
    const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
    const speed = speedFromPointer(clientX);
    AudioEngine.setSpeed(speed);
    renderSpeedBar(speed);
    hudTitle.textContent = 'VELOCIDADE';
    hudValue.textContent = speed.toFixed(2)+'x';
    hudBox.style.opacity = '1';
    clearTimeout(hudHideTimer);
  }
  speedTrack.addEventListener('pointerdown', (e)=>{
    speedTrack.setPointerCapture(e.pointerId);
    speedActive = true; applySpeed(e); vibrate(6);
  });
  speedTrack.addEventListener('pointermove', (e)=>{ if(speedActive) applySpeed(e); });
  speedTrack.addEventListener('pointerup', ()=>{ speedActive=false; hideHudSoon(); });
  speedTrack.addEventListener('pointercancel', ()=>{ speedActive=false; hideHudSoon(); });

  /* ========================================================
     RUNNING SESSION
     ======================================================== */
  const runTimer = document.getElementById('run-timer');
  const btnPause = document.getElementById('btn-pause');
  const btnEnd = document.getElementById('btn-end');
  const carregandoEl = document.getElementById('carregando');

  let session = null;
  function fmtClock(ms){
    const totalSec = Math.max(0, Math.round(ms/1000));
    const m = Math.floor(totalSec/60), s = totalSec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function startSession(minutes){
    carregandoEl.style.opacity = '0.6';
    renderProgressSegments(0);
    initEqDisplay();
    renderSpeedBar(AudioEngine.getSpeed());

    session = { plannedMs: minutes*60000, startedAt: Date.now(), pausedTotal: 0, paused: false, pauseStartedAt: 0 };

    goTo('run');
    resizeCanvas();
    if(vizRAF) cancelAnimationFrame(vizRAF);
    drawViz();
    tick();

    AudioEngine.init(()=>{ carregandoEl.style.opacity = '0'; });
  }
  function elapsedMs(){
    if(!session) return 0;
    const now = Date.now();
    const pausedExtra = session.paused ? (now - session.pauseStartedAt) : 0;
    return now - session.startedAt - session.pausedTotal - pausedExtra;
  }
  let tickHandle = null;
  function tick(){
    tickHandle = requestAnimationFrame(tick);
    if(!session || session.paused) return;
    const el = elapsedMs();
    const remaining = session.plannedMs - el;
    const pct = Math.min(1, el/session.plannedMs);
    renderProgressSegments(pct);
    runTimer.textContent = fmtClock(Math.max(0,remaining));
    if(remaining <= 0) endSession();
  }
  let isPaused = false;
  btnPause.addEventListener('click', ()=>{
    if(!session) return;
    isPaused = !isPaused;
    session.paused = isPaused;
    if(isPaused){
      session.pauseStartedAt = Date.now();
      AudioEngine.fadeMaster(0.0, 0.5);
      btnPause.textContent = '▶ CONTINUAR';
      btnPause.classList.add('muted');
    } else {
      session.pausedTotal += Date.now() - session.pauseStartedAt;
      AudioEngine.fadeMaster(0.95, 0.5);
      btnPause.textContent = 'II PAUSAR';
      btnPause.classList.remove('muted');
    }
    vibrate(10);
  });
  btnEnd.addEventListener('click', ()=>{ if(!session) return; vibrate(14); endSession(); });

  let pendingLog = null;
  function endSession(){
    if(!session) return;
    const el = Math.round(elapsedMs()/1000/60);
    const durationMinutes = Math.max(1, el);
    const startedAt = session.startedAt;
    const endedAt = Date.now();

    if(vizRAF) cancelAnimationFrame(vizRAF);
    if(tickHandle) cancelAnimationFrame(tickHandle);
    AudioEngine.stopAll();

    isPaused = false;
    btnPause.textContent = 'II PAUSAR';
    btnPause.classList.remove('muted');
    renderProgressSegments(0);

    pendingLog = { durationMinutes, startedAt, endedAt };
    session = null;
    openLogging(pendingLog);
  }

  /* ========================================================
     LOGGING
     ======================================================== */
  const logDuration = document.getElementById('log-duration');
  const logList = document.getElementById('log-list');
  const btnSkip = document.getElementById('btn-skip');
  const CATEGORIES = {
    'Trabalho': ['Reuniões','Produção','Planejamento','Administrativo'],
    'Faculdade': ['Estudo','Trabalho acadêmico','Prova / Revisão','Aula'],
  };
  function renderMainCategories(){
    logList.innerHTML = '';
    Object.keys(CATEGORIES).forEach(cat=>{
      const row = document.createElement('div');
      row.className = 'log-row plain';
      row.innerHTML = '<span>'+cat+'</span><span class="arrow">&gt;</span>';
      row.addEventListener('click', ()=>{ vibrate(8); renderSubcategories(cat); });
      logList.appendChild(row);
    });
  }
  function renderSubcategories(cat){
    logList.innerHTML = '';
    const back = document.createElement('div');
    back.className = 'log-back plain';
    back.textContent = '← voltar';
    back.addEventListener('click', ()=>{ vibrate(6); renderMainCategories(); });
    logList.appendChild(back);
    CATEGORIES[cat].forEach(sub=>{
      const row = document.createElement('div');
      row.className = 'log-row plain';
      row.innerHTML = '<span>'+sub+'</span><span class="arrow"></span>';
      row.addEventListener('click', ()=>{ vibrate(10); commitLog(cat, sub); });
      logList.appendChild(row);
    });
  }
  function openLogging(data){
    logDuration.textContent = data.durationMinutes + ' min';
    renderMainCategories();
    goTo('log');
  }
  function commitLog(category, subcategory){
    if(!pendingLog) return;
    saveSession({
      id: 's_'+Date.now(),
      date: new Date(pendingLog.startedAt).toISOString(),
      startedAt: pendingLog.startedAt,
      endedAt: pendingLog.endedAt,
      durationMinutes: pendingLog.durationMinutes,
      category: category || null,
      subcategory: subcategory || null,
    });
    pendingLog = null;
    resetSetup();
    goTo('setup');
  }
  btnSkip.addEventListener('click', ()=>{ vibrate(6); commitLog(null,null); });
  function resetSetup(){
    selectedMinutes = 0;
    renderBar(0,0);
    setupTime.classList.remove('show');
    setupHint.classList.remove('hidden');
  }

  /* ========================================================
     HISTORY
     ======================================================== */
  const btnHistory = document.getElementById('btn-history');
  const btnHistoryBack = document.getElementById('btn-history-back');
  const historyTotal = document.getElementById('history-total');
  const historyCount = document.getElementById('history-count');
  const historyList = document.getElementById('history-list');
  const historyFilters = document.querySelector('.history-filters');
  let currentFilter = 'all';
  function renderHistory(){
    const all = loadSessions().slice().sort((a,b)=>b.startedAt-a.startedAt);
    const filtered = currentFilter==='all' ? all : all.filter(s=>s.category===currentFilter);
    const totalMin = filtered.reduce((sum,s)=>sum+s.durationMinutes,0);
    const hh = Math.floor(totalMin/60), mm = totalMin%60;
    historyTotal.textContent = hh+'h '+String(mm).padStart(2,'0');
    historyCount.textContent = filtered.length + (filtered.length===1?' sessão':' sessões');
    historyList.innerHTML = '';
    if(filtered.length===0){
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'nenhuma sessão ainda';
      historyList.appendChild(empty);
      return;
    }
    filtered.forEach(s=>{
      const d = new Date(s.startedAt);
      const dateStr = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
      const row = document.createElement('div');
      row.className = 'history-row';
      const catLabel = s.category ? (s.category + (s.subcategory ? ' · '+s.subcategory : '')) : 'sem categoria';
      row.innerHTML = '<span class="h-date">'+dateStr+'</span><span class="h-cat">'+catLabel+'</span><span>'+s.durationMinutes+'m</span>';
      historyList.appendChild(row);
    });
  }
  historyFilters.addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    currentFilter = btn.dataset.filter;
    [...historyFilters.children].forEach(b=>b.classList.toggle('active', b===btn));
    renderHistory();
  });
  btnHistory.addEventListener('click', ()=>{ vibrate(6); renderHistory(); goTo('history'); });
  btnHistoryBack.addEventListener('click', ()=>{ vibrate(6); goTo('setup'); });

  /* ========================================================
     INIT
     ======================================================== */
  resizeCanvas();
  renderBar(0,0);
})();
</script>
</body>
</html>
